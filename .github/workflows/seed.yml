name: Seed quotidien

# Crawl de seed Phase 2b. Tourne depuis la CI, jamais depuis une session de dev.
#
# NE PAS « CORRIGER » EN '0 6 * * *' : le cron GitHub Actions est TOUJOURS en UTC.
# '0 5 * * *' = 5 h UTC = 6 h à Paris en heure d'hiver (CET, UTC+1), 7 h en heure d'été
# (CEST, UTC+2). GitHub ne gère pas de fuseau horaire ; l'écart d'une heure en été est accepté.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      cellule:
        description: 'Limiter à une cellule « Catégorie|Marque » (lancement J+1). Vide = toutes les cellules validées.'
        required: false
        default: ''

# Jamais deux crawls en parallèle : le budget est compté sur la campagne.
concurrency:
  group: seed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
      APIFY_ACTOR_ID: ${{ vars.APIFY_ACTOR_ID }}
      SEED_COUT_PAR_1000_CENTS: ${{ vars.SEED_COUT_PAR_1000_CENTS }}
      # Frais fixes par run de l'acteur (démarrage), en centimes d'euro : comptés dans l'arrêt dur.
      SEED_COUT_PAR_RUN_CENTS: ${{ vars.SEED_COUT_PAR_RUN_CENTS }}
      # Plafond mensuel en centimes ; arrêt dur à 80 % (8 000 = 80 €), campagne seed-YYYY-MM auto.
      SEED_BUDGET_CENTS_MAX: ${{ vars.SEED_BUDGET_CENTS_MAX || '10000' }}
    steps:
      # Échec immédiat et explicite si la configuration est absente : aucun install, aucun appel.
      - name: Vérifier la configuration
        run: |
          missing=0
          if [ -z "$APIFY_TOKEN" ]; then echo "::error title=Seed non configuré::APIFY_TOKEN manquant, configurer le secret"; missing=1; fi
          if [ -z "$DATABASE_URL" ]; then echo "::error title=Seed non configuré::SEED_DATABASE_URL manquant, configurer le secret"; missing=1; fi
          if [ -z "$APIFY_ACTOR_ID" ]; then echo "::error title=Seed non configuré::APIFY_ACTOR_ID manquant, configurer la variable"; missing=1; fi
          if [ -z "$SEED_COUT_PAR_1000_CENTS" ]; then echo "::error title=Seed non configuré::SEED_COUT_PAR_1000_CENTS manquant (tarif réel de l'acteur, en centimes d'euro)"; missing=1; fi
          if [ -z "$SEED_COUT_PAR_RUN_CENTS" ]; then echo "::error title=Seed non configuré::SEED_COUT_PAR_RUN_CENTS manquant (frais fixes par run de l'acteur, en centimes d'euro)"; missing=1; fi
          exit $missing

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Appliquer les migrations
        run: pnpm db:migrate

      # seed:run est en dry-run par défaut : --execute est obligatoire pour dépenser.
      # Code de sortie 3 = arrêt dur budgétaire (80 % du plafond) : le job échoue, GitHub notifie.
      - name: Lancer le seed (arrêt dur à 80 % du plafond)
        run: |
          mkdir -p logs
          pnpm seed:run --execute --budget-max "$SEED_BUDGET_CENTS_MAX" \
            --log-file "$GITHUB_WORKSPACE/logs/seed-$(date -u +%Y%m%dT%H%M%SZ).jsonl" \
            ${CELLULE:+--cellule "$CELLULE"}
        env:
          CELLULE: ${{ inputs.cellule }}

      - name: Archiver les logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 90
